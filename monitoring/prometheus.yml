# SecScan AI YAML configuration
# SecScan AI Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # SecScan AI application metrics
  - job_name: 'secscan_ai-app'
    static_configs:
      - targets: ['secscan_ai-app:8000']
