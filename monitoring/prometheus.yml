# HACKNOVA YAML configuration
# HACKNOVA Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # HACKNOVA application metrics
  - job_name: 'hacknova-app'
    static_configs:
      - targets: ['hacknova-app:8000']
