# SecScan AI YAML configuration
name: 🌟 Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: 👋 Welcome Message
    runs-on: ubuntu-latest
    steps:
    - name: Welcome new issue creator
      if: github.event_name == 'issues'
      uses: actions/github-script@v7
      with:
        script: |
          const welcomeMessage = `
          👋 **Welcome to SecScan AI Enterprise!**

          Thank you for opening an issue. Please keep reproduction details free of
          credentials, private customer data, and unapproved target information.

          ## 🚀 What happens next?
          - Our team will review your issue within 24-48 hours
          - You'll receive updates on progress and any questions we might have
          - Feel free to join our [WhatsApp Business Channel](https://whatsapp.com/channel/0029Vaoa1GfKLaHlL0Kc8k1q) for real-time updates

          ## 🤝 Want to contribute?
          - Check out our [Contributing Guide](.github/CONTRIBUTING.md)
          - Browse [good first issues](https://github.com/najafdev/secscan_ai/labels/good%20first%20issue)
          - Join our community discussions

          ## 💰 Support the Project
          - ⭐ Star the repository
          - 💰 [Support development](DONATE.md)
          - 📢 Share with your network

          **Created by [Yashab Alam](https://github.com/yashab-cyber)**

          Thank you for helping make cybersecurity more accessible through AI! 🛡️
          `;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: welcomeMessage
          });

    - name: Welcome pull-request contributor
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const welcomeMessage = `
          🎉 **Thank you for contributing to SecScan AI Enterprise!**

          Automated checks are review evidence, not a guarantee of acceptance or
          security completeness. Please keep secrets, credentials, and customer data out of the PR.

          ## 📋 Review Process
          - Our team will review your PR within 24-48 hours
          - We may request changes or ask questions
          - Once approved, your contribution will be merged

          ## 🏆 Recognition
          - All contributors are listed in [CONTRIBUTORS.md](CONTRIBUTORS.md)
          - You'll receive a contributor badge
          - Significant contributions get special recognition

          ## 💡 Need Help?
          - Check our [Contributing Guide](.github/CONTRIBUTING.md)
          - Join [WhatsApp Business Channel](https://whatsapp.com/channel/0029Vaoa1GfKLaHlL0Kc8k1q)
          - Email: yashabalam707@gmail.com

          **Welcome to the SecScan AI Enterprise family! 🚀**

          *Made with ❤️ by [Yashab Alam](https://github.com/yashab-cyber)*
          `;
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: welcomeMessage
          });

  label-activity:
    name: 🏷️ Label Activity
    runs-on: ubuntu-latest
    steps:
    - name: Apply existing repository labels only
      uses: actions/github-script@v7
      with:
        script: |
          const isIssue = context.eventName === 'issues';
          const subject = isIssue ? context.payload.issue : context.payload.pull_request;
          const title = (subject.title || '').toLowerCase();
          const body = (subject.body || '').toLowerCase();
          const desired = isIssue ? ['needs-triage'] : ['needs-review'];

          if (title.includes('bug') || title.includes('fix') || body.includes('error')) {
            desired.push(isIssue ? 'bug' : 'bug-fix');
          }
          if (title.includes('feature') || title.includes('feat') || body.includes('feature request')) {
            desired.push('enhancement');
          }
          if (title.includes('doc') || body.includes('documentation')) {
            desired.push('documentation');
          }
          if (title.includes('security') || body.includes('vulnerability')) {
            desired.push('security');
          }

          const repoLabels = await github.paginate(
            github.rest.issues.listLabelsForRepo,
            { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
          );
          const existing = new Set(repoLabels.map(label => label.name));
          const labels = [...new Set(desired)].filter(label => existing.has(label));

          if (labels.length) {
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels
            });
          }

  notify-team:
    name: 📢 Repository Activity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Record activity
      run: |
        echo "Repository event: ${{ github.event_name }}"
        echo "Actor: ${{ github.actor }}"
        echo "Repository: ${{ github.repository }}"
