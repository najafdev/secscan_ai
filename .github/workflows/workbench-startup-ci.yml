name: Workbench Startup

on:
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench-startup-ci.yml']
  push:
    branches: [main]
    paths: ['workbench/**', '.github/workflows/workbench-startup-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: Startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Additive launcher, duplicate-start, storage-fault and owned-assessment regressions
        env:
          SECSCAN_AI_STARTUP_TRACE: '1'
        run: python -m unittest workbench.tests.test_startup_trace workbench.tests.test_startup workbench.tests.test_windows_launcher_contract -v
