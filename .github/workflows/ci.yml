# SecScan AI YAML configuration
name: SecScan AI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap nikto gobuster libldap2-dev libsasl2-dev portaudio19-dev python3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 secscan_ai.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 secscan_ai.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short

    - name: Run deterministic installation readiness check
      run: |
        python test_installation.py --ci

    - name: Test legacy entry-point import
      run: |
        python -c "from secscan_ai import SecScanAI, AIEngine, ToolManager; print('Import successful')"

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Generate Bandit advisory report
      run: |
        pip install bandit
        bandit -r secscan_ai.py -f json -o bandit-report.json || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan
        path: bandit-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t secscan_ai:test .

    - name: Test Docker image
      run: |
        docker run --rm secscan_ai:test --help
        docker run --rm --entrypoint python3 secscan_ai:test -c "import secscan_ai; print('Docker image OK')"
