name: Evidence Workbench Release Package

on:
  push:
    branches: [main, 'feat/evidence-workbench', 'workbench/**']
    paths: ['workbench/**', '.github/workflows/workbench-release-package.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/workbench-release-package.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      package_basename: ${{ steps.package.outputs.package_basename }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build deterministic portable source package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_BASENAME="secscan_ai-evidence-workbench-${GITHUB_SHA}"
          mkdir -p _release/stage
          git archive --format=tar --prefix="${PACKAGE_BASENAME}/" HEAD workbench LICENSE | tar -xf - -C _release/stage
          python -m workbench.release_evidence --output-dir "_release/stage/${PACKAGE_BASENAME}/release-evidence"
          PACKAGE_BASENAME="$PACKAGE_BASENAME" python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('_release/stage') / os.environ['PACKAGE_BASENAME']
          document = {
              'schema': 'secscan_ai.portable-source-release/v1',
              'checked_out_revision': os.environ['GITHUB_SHA'],
              'component': 'SecScan AI Evidence Workbench',
              'entrypoint': 'python -m workbench',
              'python_minimum': '3.11',
              'third_party_python_runtime_packages': [],
              'bundled_scanner_binaries_or_images': [],
              'optional_reviewed_scanner': 'Semgrep CE 1.177.0 digest-pinned external container; not bundled or automatically pulled',
              'includes_cyclonedx_sbom': True,
              'includes_synthetic_sample_report': True,
              'package_kind': 'portable-source-archive',
              'native_installer': False,
              'external_assessment_target_used_to_build': False,
              'customer_data_used_to_build': False,
          }
          (root / 'PACKAGE-MANIFEST.json').write_text(json.dumps(document, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf "_release/${PACKAGE_BASENAME}.tar" -C _release/stage "$PACKAGE_BASENAME"
          gzip -n -9 "_release/${PACKAGE_BASENAME}.tar"
          sha256sum "_release/${PACKAGE_BASENAME}.tar.gz" | tee _release/SHA256SUMS
          cp "_release/stage/${PACKAGE_BASENAME}/PACKAGE-MANIFEST.json" _release/PACKAGE-MANIFEST.json
          cp "_release/stage/${PACKAGE_BASENAME}/release-evidence/sbom.cdx.json" _release/sbom.cdx.json
          echo "package_basename=${PACKAGE_BASENAME}" >> "$GITHUB_OUTPUT"
      - name: Upload exact package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-release-candidate-${{ github.sha }}
          path: |
            _release/${{ steps.package.outputs.package_basename }}.tar.gz
            _release/SHA256SUMS
            _release/PACKAGE-MANIFEST.json
            _release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    needs: build-package
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workbench-release-candidate-${{ github.sha }}
          path: _candidate
      - name: Smoke exact package on this platform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _package_smoke
          python -m workbench.tests.package_smoke _candidate 2>&1 | tee "_package_smoke/${RUNNER_OS}.json"
      - name: Upload package smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-package-smoke-${{ matrix.os }}-${{ github.sha }}
          path: _package_smoke/
          if-no-files-found: error
          retention-days: 7

  # Pull requests, especially fork-originated upstream contributions, intentionally stop
  # after exact-package cross-platform smoke. Attestation needs repository write/OIDC
  # authority and therefore only runs for trusted push/manual contexts after the same
  # build-package and package-smoke jobs have succeeded.
  attest-package:
    if: github.event_name != 'pull_request'
    needs: [build-package, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download cross-platform-smoked package candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: workbench-release-candidate-${{ github.sha }}
          path: _release
      - name: Validate downloaded package identity
        env:
          PACKAGE_BASENAME: ${{ needs.build-package.outputs.package_basename }}
        shell: bash
        run: |
          set -euo pipefail
          : "${PACKAGE_BASENAME:?Missing package basename from build-package}"
          test "$PACKAGE_BASENAME" = "secscan_ai-evidence-workbench-${GITHUB_SHA}"
          test -s "_release/${PACKAGE_BASENAME}.tar.gz"
          sha256sum --check --strict _release/SHA256SUMS
      - name: Generate signed build provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: _release/${{ needs.build-package.outputs.package_basename }}.tar.gz
      - name: Generate signed SBOM attestation
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: _release/${{ needs.build-package.outputs.package_basename }}.tar.gz
          sbom-path: _release/sbom.cdx.json
      - name: Preserve and verify attestation evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE_URL: ${{ steps.provenance.outputs.attestation-url }}
          PROVENANCE_ID: ${{ steps.provenance.outputs.attestation-id }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
          SBOM_URL: ${{ steps.sbom_attestation.outputs.attestation-url }}
          SBOM_ID: ${{ steps.sbom_attestation.outputs.attestation-id }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="_release/${{ needs.build-package.outputs.package_basename }}.tar.gz"
          test -f "$PACKAGE"
          test -s "$PROVENANCE_BUNDLE"
          test -s "$SBOM_BUNDLE"
          cp "$PROVENANCE_BUNDLE" _release/provenance.sigstore.json
          cp "$SBOM_BUNDLE" _release/sbom-attestation.sigstore.json
          test -n "$PROVENANCE_ID"
          test -n "$PROVENANCE_URL"
          test -n "$SBOM_ID"
          test -n "$SBOM_URL"
          printf '%s\n' \
            "provenance_attestation_id=$PROVENANCE_ID" \
            "provenance_attestation_url=$PROVENANCE_URL" \
            "sbom_attestation_id=$SBOM_ID" \
            "sbom_attestation_url=$SBOM_URL" \
            > _release/ATTESTATIONS.txt
          gh attestation verify "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle _release/provenance.sigstore.json \
            --predicate-type https://slsa.dev/provenance/v1 \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/workbench-release-package.yml" \
            2>&1 | tee _release/provenance-verification.txt
          gh attestation verify "$PACKAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle _release/sbom-attestation.sigstore.json \
            --predicate-type https://cyclonedx.org/bom \
            --source-digest "$GITHUB_SHA" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/workbench-release-package.yml" \
            2>&1 | tee _release/sbom-attestation-verification.txt
      - name: Upload attested portable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workbench-release-package-${{ github.sha }}
          path: |
            _release/${{ needs.build-package.outputs.package_basename }}.tar.gz
            _release/SHA256SUMS
            _release/PACKAGE-MANIFEST.json
            _release/sbom.cdx.json
            _release/provenance.sigstore.json
            _release/sbom-attestation.sigstore.json
            _release/ATTESTATIONS.txt
            _release/provenance-verification.txt
            _release/sbom-attestation-verification.txt
          if-no-files-found: error
          retention-days: 7

# The portable source archive is built once, then the exact SHA-256-addressed bytes are
# extracted and smoke-tested on GitHub-hosted Ubuntu, macOS and Windows. Trusted push or
# manual runs then sign that already-smoked archive and verify the exact local provenance
# and CycloneDX SBOM bundles against the artifact, repository and source revision. Pull
# requests never receive the repository write/OIDC authority needed for attestations. The
# workflow does not publish a release, registry object, website or scanner image.
# GitHub/Sigstore attestations bind provenance/SBOM to source bytes; they are not a
# security certification or native code-signing identity.
